name: intirasolusi_app
description: Intira Customer Mobile App - Aplikasi Gadai Online
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  
  # Network & API
  dio: ^5.4.1
  http_parser: ^4.0.2
  json_annotation: ^4.8.1
  connectivity_plus: ^7.0.0
  
  # Local Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  
  # UI Components
  google_fonts: ^8.0.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  
  # Forms & Validation
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0
  
  # Image & Camera
  image_picker: ^1.0.7
  image_cropper: ^11.0.0
  image: ^4.1.3
  photo_view: ^0.15.0
  camera: ^0.11.1
  
  # Google ML Kit (OCR & Face Detection)
  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_face_detection: ^0.12.0
  
  # KTP Extractor (auto-crop via Object Detection + supplement parsing)
  ktp_extractor: ^0.0.3
  
  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  
  # Utilities
  intl: any
  url_launcher: ^6.2.5
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  permission_handler: ^12.0.1
  
  # Biometric Authentication
  local_auth: ^2.3.0
  
  # Barcode
  barcode_widget: ^2.0.4
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  
  # App Icon & Splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.5
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
